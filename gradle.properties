# Parallel mode is disabled because modelix.editor resolves other projects' configurations at configuration time
# (mps/build.gradle.kts), which Gradle 9 rejects in parallel mode.
org.gradle.parallel=false
org.gradle.caching=true

org.gradle.jvmargs=-Xmx1024m "-XX:MaxMetaspaceSize=2g"
systemProp.org.gradle.internal.http.socketTimeout=120000
kotlin.daemon.jvmargs=-Xmx2G
